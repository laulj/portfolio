name: Publish container image

# Publishes the Dockerfile image to GitHub Container Registry:
#   ghcr.io/laulj/portfolio:latest   (every push to main, and every v* tag)
#   ghcr.io/laulj/portfolio:vX.Y.Z   (tag pushes)
#   ghcr.io/laulj/portfolio:sha-abc1234
#
# No repository secrets are required: the Dockerfile supplies build-only values
# for SECRET_KEY/DEBUG, and the image is published with the workflow GITHUB_TOKEN.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Render (and Heroku) run linux/amd64; add linux/arm64 here if needed
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
